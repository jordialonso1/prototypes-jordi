<!DOCTYPE html>
<html lang="en" data-theme="core" data-ui-mode="light">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product view</title>
  <link rel="stylesheet" href="../_base/base.css" />
  <link rel="stylesheet" href="../../../shared-design-system/pintxo/pintxo.css" />
  <link rel="stylesheet" href="./screen.css" />
</head>
<body>
  <!--
    Product view, copied from screens-library/screens/product-view and iterated here
    for the CNA "change customisations" flow. Opened over the cart in an iframe:
    ?id=<product id>&sel=<json of the current selections>.
    Talks to the cart with postMessage: pv-confirm {id, sel} / pv-close.
  -->
  <div class="prototype-viewport">

    <section class="screen is-active" id="screen-product-view" data-screen="product-view" aria-label="Product view">

      <div class="pv-nav" id="pv-nav">
        <div class="pintxo-status-bar">
          <span class="pintxo-status-bar__time">9:41</span>
          <span class="pintxo-status-bar__levels">
            <img src="../../../shared-design-system/pintxo/assets/status-bar-cell.svg" alt="" />
            <img src="../../../shared-design-system/pintxo/assets/status-bar-wifi.svg" alt="" />
            <img src="../../../shared-design-system/pintxo/assets/status-bar-battery.svg" alt="" />
          </span>
        </div>
        <div class="pv-nav__row">
          <button class="icon-btn icon-btn--floating" id="pv-close" type="button" aria-label="Close"><img src="assets/icons/cross-24.svg" alt="" /></button>
          <p class="pv-nav__title pintxo-typography-body1-emphasis" id="pv-nav-title"></p>
        </div>
      </div>

      <div class="screen__scroll" id="pv-scroll">
        <div class="pv-image">
          <img class="pv-image__photo" id="pv-photo" src="" alt="" />
          <img class="pv-image__curve" src="assets/icons/curve-product.svg" alt="" />
        </div>

        <div class="pv-info">
          <div class="pv-main">
            <div class="pv-name-price">
              <h1 class="pv-name pintxo-typography-title1" id="pv-name"></h1>
              <p class="pv-price"><span class="pv-price__now" id="pv-price"></span></p>
            </div>
            <p class="pv-desc pintxo-typography-body2" id="pv-desc"></p>
          </div>
          <div class="cz-list" id="pv-sections"></div>
        </div>
      </div>

      <footer class="pv-footer">
        <button class="pintxo-button pintxo-button--primary pintxo-button--m pintxo-button--block" id="pv-confirm" type="button">Confirm change</button>
      </footer>
    </section>

  </div>
  <script src="../_base/base.js"></script>
  <script src="../catalog.js"></script>
  <script src="./pv.js"></script>
</body>
</html>
