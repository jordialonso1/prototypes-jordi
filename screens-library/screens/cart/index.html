<!DOCTYPE html>
<html lang="en" data-theme="core" data-ui-mode="light">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart</title>
  <link rel="stylesheet" href="../_base/base.css" />
  <link rel="stylesheet" href="../../../shared-design-system/pintxo/pintxo.css" />
  <link rel="stylesheet" href="./screen.css" />
</head>
<body>
  <div class="prototype-viewport">

<section class="screen is-active" data-screen="regular" aria-label="Cart">
      <div class="scroll">
        <div class="stack stack--end">
          <header class="section-header">
            <div class="section-header__title-row">
              <h1 class="section-header__title pintxo-typography-title3">Your cart</h1>
              <button type="button" class="pintxo-icon-button pintxo-icon-button--s" aria-label="Empty cart"><img src="assets/icon-trash-16.svg" width="16" height="16" alt="" /></button>
            </div>
            <p class="section-header__sub pintxo-typography-body2"><span class="count">2 products from</span> <a href="#">Honest Greens</a></p>
          </header>

          <article class="item-row" data-id="42274330448">
            <div class="item-row__body">
              <div class="thumb"><img src="https://hnst-files.s3-eu-west-1.amazonaws.com/products/medium/efc3a9c4-abfc-44ea-9dd9-e3cd9ee76414.png" alt="" loading="lazy" /></div>
              <div class="item-row__info">
                <div class="item-row__head">
                  <p class="item-row__name item-row__name--medium pintxo-typography-body1-emphasis">Breakfast Burrito</p>
                  <p class="item-row__price pintxo-typography-body2">8,45€</p>
                </div>
              </div>
            </div>
            <div class="item-row__footer">
              <div class="pintxo-counter">
                <button type="button" class="pintxo-counter__button" aria-label="Remove"><img src="assets/icon-trash-16.svg" width="16" height="16" alt="" /></button>
                <span class="pintxo-counter__label">1</span>
                <button type="button" class="pintxo-counter__button" aria-label="Add one more"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button>
              </div>
            </div>
          </article>
          <article class="item-row" data-id="42336174195">
            <div class="item-row__body">
              <div class="thumb"><img src="https://hnst-files.s3-eu-west-1.amazonaws.com/products/medium/183194e6-8080-4753-bad1-394b30445c42.png" alt="" loading="lazy" /></div>
              <div class="item-row__info">
                <div class="item-row__head">
                  <p class="item-row__name item-row__name--medium pintxo-typography-body1-emphasis">Matcha Pistachio Pancakes</p>
                  <p class="item-row__price pintxo-typography-body2">10,25€</p>
                </div>
              </div>
            </div>
            <div class="item-row__footer">
              <div class="pintxo-counter">
                <button type="button" class="pintxo-counter__button" aria-label="Remove"><img src="assets/icon-trash-16.svg" width="16" height="16" alt="" /></button>
                <span class="pintxo-counter__label">1</span>
                <button type="button" class="pintxo-counter__button" aria-label="Add one more"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button>
              </div>
            </div>
          </article>

          <button type="button" class="pintxo-button pintxo-button--s">Add more items</button>
        </div>

        <div class="stack">
          <header class="section-header"><h2 class="section-header__title pintxo-typography-title3">You might also like</h2></header>
          <div class="tiles">
            <article class="tile" data-id="42320609711">
              <div class="tile__img"><img src="https://hnst-files.s3-eu-west-1.amazonaws.com/products/medium/a381ae37-674e-4451-b118-e4493267db3d.png" alt="" loading="lazy" /><button type="button" class="pintxo-icon-button pintxo-icon-button--s pintxo-icon-button--floating tile__add" aria-label="Add Chocolate Avo Mousse with Olive Oil &amp; Salt"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button></div>
              <div class="tile__text"><p class="tile__name pintxo-typography-body1-emphasis">Chocolate Avo Mousse with Olive Oil &amp; Salt</p><p class="tile__price pintxo-typography-body2">5,95€</p></div>
            </article>
            <article class="tile" data-id="42333383578">
              <div class="tile__img"><img src="https://hnst-files.s3-eu-west-1.amazonaws.com/products/medium/b17dfb56-2d41-44d3-ae01-15173bb5d6bd.png" alt="" loading="lazy" /><button type="button" class="pintxo-icon-button pintxo-icon-button--s pintxo-icon-button--floating tile__add" aria-label="Add Shoyu Pecan Pie"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button></div>
              <div class="tile__text"><p class="tile__name pintxo-typography-body1-emphasis">Shoyu Pecan Pie</p><p class="tile__price pintxo-typography-body2">5,75€</p></div>
            </article>
          </div>
        </div>
      </div>

      <div class="navbar">
        <img class="status-bar" src="assets/statusbar.svg" alt="" />
        <div class="navbar__row">
          <button type="button" class="pintxo-icon-button navbar__back" aria-label="Back"><img src="assets/icon-back-24.svg" width="24" height="24" alt="" /></button>
          <h2 class="navbar__title pintxo-typography-body1-emphasis">Cart</h2>
        </div>
      </div>

      <footer class="footer footer--raised">
        <div class="footer__content">
          <div class="footer__price">
            <p class="footer__total pintxo-typography-body1-emphasis">18,70€</p>
          </div>
          <button type="button" class="pintxo-button pintxo-button--primary pintxo-button--m pintxo-button--trailing-icon footer__cta">Go to checkout <img src="assets/icon-chevron-forward-white.svg" alt="" /></button>
        </div>
        <div class="footer__home"></div>
      </footer>
    </section>

  </div>
  <script src="../_base/base.js"></script>
</body>
</html>
