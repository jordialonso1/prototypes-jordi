<!DOCTYPE html>
<html lang="en" data-theme="core" data-ui-mode="light">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart</title>
  <link rel="stylesheet" href="../_base/base.css" />
  <link rel="stylesheet" href="../../../shared-design-system/pintxo/pintxo.css" />
  <link rel="stylesheet" href="./screen.css" />
</head>
<body>
  <div class="prototype-viewport">

<section class="screen is-active" data-screen="regular" aria-label="Cart">
      <div class="scroll">
        <div class="stack stack--end">
          <header class="section-header">
            <div class="section-header__title-row">
              <h1 class="section-header__title pintxo-typography-title3">Your cart</h1>
              <button type="button" class="pintxo-icon-button pintxo-icon-button--s" aria-label="Empty cart"><img src="assets/icon-trash-16.svg" width="16" height="16" alt="" /></button>
            </div>
            <p class="section-header__sub pintxo-typography-body2"><span class="count">2 products from</span> <a href="#">Healthy Poke</a></p>
          </header>

          <article class="item-row">
            <div class="item-row__body">
              <div class="thumb"><img src="assets/item-gyozas.jpg" alt="" /></div>
              <div class="item-row__info">
                <div class="item-row__head">
                  <p class="item-row__name pintxo-typography-body1">Gyozas de salmón</p>
                  <p class="item-row__price pintxo-typography-body2">9,99€</p>
                </div>
                <p class="item-row__desc pintxo-typography-body2">Empanadillas japonesas con salmón. Cinco unidades. Contiene soja, pescado, trigo.</p>
              </div>
            </div>
            <div class="item-row__footer">
              <div class="pintxo-counter">
                <button type="button" class="pintxo-counter__button" aria-label="Remove"><img src="assets/icon-trash-16.svg" width="16" height="16" alt="" /></button>
                <span class="pintxo-counter__label">1</span>
                <button type="button" class="pintxo-counter__button" aria-label="Add one more"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button>
              </div>
            </div>
          </article>

          <button type="button" class="pintxo-button pintxo-button--s">Add more items</button>
        </div>

        <div class="stack">
          <header class="section-header"><h2 class="section-header__title pintxo-typography-title3">You might also like</h2></header>
          <div class="tiles">
            <article class="tile">
              <div class="tile__img"><img src="assets/item-plate.jpg" alt="" /><button type="button" class="pintxo-icon-button pintxo-icon-button--s pintxo-icon-button--floating tile__add" aria-label="Add Item name"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button></div>
              <div class="tile__text"><p class="tile__name pintxo-typography-body1-emphasis">Item name</p><p class="tile__price pintxo-typography-body2">9,99€</p></div>
            </article>
            <article class="tile">
              <div class="tile__img"><img src="assets/item-plate.jpg" alt="" /><button type="button" class="pintxo-icon-button pintxo-icon-button--s pintxo-icon-button--floating tile__add" aria-label="Add Item name"><img src="assets/icon-plus-16.svg" width="16" height="16" alt="" /></button></div>
              <div class="tile__text"><p class="tile__name pintxo-typography-body1-emphasis">Item name</p><p class="tile__price pintxo-typography-body2">9,99€</p></div>
            </article>
          </div>
        </div>
      </div>

      <div class="navbar">
        <img class="status-bar" src="assets/statusbar.svg" alt="" />
        <div class="navbar__row">
          <button type="button" class="pintxo-icon-button navbar__back" aria-label="Back"><img src="assets/icon-back-24.svg" width="24" height="24" alt="" /></button>
          <h2 class="navbar__title pintxo-typography-body1-emphasis">Cart</h2>
        </div>
      </div>

      <footer class="footer footer--raised">
        <div class="footer__content">
          <div class="footer__price">
            <p class="footer__total pintxo-typography-body1-emphasis">8,00€</p>
            <p class="footer__original pintxo-typography-body1">10,00€</p>
          </div>
          <button type="button" class="pintxo-button pintxo-button--primary pintxo-button--m pintxo-button--trailing-icon footer__cta">Go to checkout <img src="assets/icon-chevron-forward-white.svg" alt="" /></button>
        </div>
        <div class="footer__home"></div>
      </footer>
    </section>

  </div>
  <script src="../_base/base.js"></script>
</body>
</html>
